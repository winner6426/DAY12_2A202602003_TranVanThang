name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test checkpoints
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-dummy
      REDIS_URL: "fake://"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run CP1 through CP4
        run: python -m pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py -m "not docker" -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag day12-chat:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PUBLIC_URL: https://capable-imagination-production.up.railway.app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy verified source
        run: railway up --service capable-imagination --message "GitHub Actions ${GITHUB_SHA}"

      - name: Smoke test deployed service
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$PUBLIC_URL/healthz"; then
              exit 0
            fi
            echo "Waiting for Railway deployment ($attempt/12)..."
            sleep 10
          done
          exit 1
